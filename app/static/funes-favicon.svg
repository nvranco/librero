<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
     role="img" aria-label="Funes">
  <!-- Favicon de Funes: el mismo laberinto que el logo (funes-logo.svg y el SVG
       inline del header del chat), en blanco y sobre fondo transparente, para
       la barra de pestañas oscura.

       Archivo aparte y no data-URI adentro del <link> por dos motivos: el
       data-URI obliga a escapar cada comilla y cada almohadilla a mano, y
       encima ahi no entra el bloque <style> de abajo.

       El blanco fijo desaparece en un navegador con tema claro, asi que la
       media query lo baja al color de tinta de la marca. Chrome y Firefox
       aplican prefers-color-scheme adentro de un favicon SVG; Safari no soporta
       favicon SVG y cae al de base.html, igual que ya pasaba antes. -->
  <style>
    svg { color: #FFFFFF; }
    @media (prefers-color-scheme: light) { svg { color: #2E2116; } }
  </style>
  <circle cx="16" cy="16" r="13"  stroke-dasharray="65.8 15.9"  transform="rotate(-125 16 16)"/>
  <circle cx="16" cy="16" r="9.3" stroke-dasharray="47.1 11.4"  transform="rotate(-5 16 16)"/>
  <circle cx="16" cy="16" r="5.6" stroke-dasharray="28.4 6.8"   transform="rotate(115 16 16)"/>
  <circle cx="16" cy="16" r="1.5" fill="currentColor" stroke="none"/>
</svg>
