<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
     role="img" aria-label="Funes">
  <!-- Laberinto circular: anillos concentricos con una abertura cada uno,
       escalonadas, de modo que se lea como un recorrido y no como un blanco de
       tiro. Los cortes se hacen con stroke-dasharray (largo del trazo + largo
       del hueco, calculados sobre la circunferencia de cada anillo) y se ubican
       rotando cada circulo, que es mas exacto que dibujar arcos a mano.
       Usa currentColor para heredar el color del texto que tiene al lado. -->
  <circle cx="16" cy="16" r="13"  stroke-dasharray="65.8 15.9"  transform="rotate(-125 16 16)"/>
  <circle cx="16" cy="16" r="9.3" stroke-dasharray="47.1 11.4"  transform="rotate(-5 16 16)"/>
  <circle cx="16" cy="16" r="5.6" stroke-dasharray="28.4 6.8"   transform="rotate(115 16 16)"/>
  <circle cx="16" cy="16" r="1.5" fill="currentColor" stroke="none"/>
</svg>
