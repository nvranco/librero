<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block titulo %}Librero{% endblock %}</title>
<meta name="theme-color" content="#4E9FBF">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%93%9A</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          tinta: '#1A1613',
          celeste: '#4E9FBF',
          'celeste-claro': '#BFE3EE',
          crema: '#F5EFDD',
          papel: '#FFFFFF',
          borde: '#DCD3BB',
          gris: '#6B6259',
          terracota: '#C97B63',
          ambar: '#C79A3D',
          whatsapp: '#25D366',
        },
        fontFamily: {
          sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto',
                 '"Helvetica Neue"', 'Arial', 'sans-serif'],
        },
        borderRadius: { xl2: '14px' },
      },
    },
  };
</script>
<style>
  :root {
    --tinta: #1A1613; --celeste: #4E9FBF; --celeste-claro: #BFE3EE;
    --crema: #F5EFDD; --papel: #FFFFFF; --borde: #DCD3BB;
    --gris: #6B6259; --terracota: #C97B63; --ambar: #C79A3D; --whatsapp: #25D366;
  }
  html, body { background: var(--crema); }
  * { -webkit-tap-highlight-color: transparent; }
  input:focus, button:focus, a:focus { outline: 2px solid var(--celeste); outline-offset: 2px; }
  .safe-b { padding-bottom: max(env(safe-area-inset-bottom), 0px); }
  .tap { min-height: 48px; min-width: 48px; }

  /* iOS hace zoom automatico al enfocar un input con font-size < 16px.
     Forzamos 16px en todo campo editable, sin importar la clase de Tailwind. */
  input, textarea, select { font-size: 16px !important; }

  /* Botones: negro o blanco (decisión de diseño), con la excepción puntual
     de WhatsApp que usa su verde de marca para mantener el reconocimiento. */
  .btn-primario {
    background: var(--tinta); color: var(--crema);
  }
  .btn-secundario {
    background: var(--papel); color: var(--tinta);
    border: 2px solid rgba(26, 22, 19, 0.7);
  }
  .btn-whatsapp {
    background: var(--whatsapp); color: var(--papel);
  }

  /* Safari agrega su propio cromado redondeado a type=search, que se ve
     como un doble borde encima del nuestro. Lo desactivamos. */
  input[type="search"] { -webkit-appearance: none; appearance: none; }

  /* Los buscadores ya tienen su propio borde negro de 2px: el anillo de
     foco de arriba se sumaba como un segundo borde. Solo el borde. */
  input[type="search"]:focus { outline: none; }

  /* ---- Transiciones entre pantallas ----------------------------------
     Navegación real (recarga de página), animada con la View Transitions
     API: el navegador saca una foto de la pantalla que se va y la cruza
     con la que entra. Los navegadores que no la soportan navegan seco,
     sin animación y sin romperse — por eso no hay fallback en JS.

     Ida: la actual sale hacia la izquierda, la nueva entra desde la
     derecha. Volver: al revés. El desplazamiento es de 25% y no de 100%
     porque combinado con el fade se lee más rápido y no marea. */
  @view-transition { navigation: auto; }

  @keyframes salir-izq  { to   { transform: translateX(-25%); opacity: 0; } }
  @keyframes entrar-der { from { transform: translateX(25%);  opacity: 0; } }
  @keyframes salir-der  { to   { transform: translateX(25%);  opacity: 0; } }
  @keyframes entrar-izq { from { transform: translateX(-25%); opacity: 0; } }

  ::view-transition-old(root) {
    animation: salir-izq 260ms cubic-bezier(.4, 0, .2, 1) both;
  }
  ::view-transition-new(root) {
    animation: entrar-der 300ms cubic-bezier(.4, 0, .2, 1) both;
  }
  html[data-nav="atras"]::view-transition-old(root) { animation-name: salir-der; }
  html[data-nav="atras"]::view-transition-new(root) { animation-name: entrar-izq; }

  @media (prefers-reduced-motion: reduce) {
    ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
  }
</style>
<script>
  // Corre antes del primer pintado: deja marcada en <html> la dirección de la
  // animación para que el CSS de arriba ya la tenga cuando arranca la transición.
  (function () {
    var dir = null;
    try { dir = sessionStorage.getItem('librero-nav'); sessionStorage.removeItem('librero-nav'); } catch (e) {}
    if (!dir) {
      // Botón/gesto "atrás" del navegador: nadie dejó la marca, la deducimos.
      var nav = performance.getEntriesByType('navigation')[0];
      dir = (nav && nav.type === 'back_forward') ? 'atras' : 'adelante';
    }
    document.documentElement.dataset.nav = dir;
  })();

  // Volver con el gesto/botón del navegador restaura la página desde bfcache
  // sin volver a parsear el <head>, así que el script de arriba no corre otra
  // vez y la dirección quedaría con el valor de la carga anterior (adelante).
  // pagereveal sí se dispara en cada revelado, antes del primer pintado.
  window.addEventListener('pagereveal', function () {
    var marca = null;
    try { marca = sessionStorage.getItem('librero-nav'); sessionStorage.removeItem('librero-nav'); } catch (e) {}
    if (marca) {
      document.documentElement.dataset.nav = marca;
    } else if (window.__libreroRevelado) {
      // Ya se había revelado y nadie dejó marca: volvimos acá desde bfcache.
      document.documentElement.dataset.nav = 'atras';
    }
    window.__libreroRevelado = true;
  });

  // Navegación desde JS. Los links usan data-nav (ver el listener de abajo).
  function irA(url, direccion) {
    try { sessionStorage.setItem('librero-nav', direccion || 'adelante'); } catch (e) {}
    window.location.href = url;
  }

  // Un solo listener para todos los links: 'adelante' es el default, así que
  // solo hace falta marcar data-nav="atras" en los de volver.
  document.addEventListener('click', function (e) {
    var link = e.target.closest && e.target.closest('a[data-nav]');
    if (!link) return;
    try { sessionStorage.setItem('librero-nav', link.dataset.nav); } catch (err) {}
  }, true);
</script>
{% block head %}{% endblock %}
</head>
<body class="font-sans text-tinta bg-crema min-h-screen antialiased">
{% block contenido %}{% endblock %}
</body>
</html>
