<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block titulo %}Librero{% endblock %}</title>
<meta name="theme-color" content="#4E9FBF">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%93%9A</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          tinta: '#1A1613',
          celeste: '#4E9FBF',
          'celeste-claro': '#BFE3EE',
          crema: '#F5EFDD',
          papel: '#FFFFFF',
          borde: '#DCD3BB',
          gris: '#6B6259',
          terracota: '#C97B63',
          ambar: '#C79A3D',
          whatsapp: '#25D366',
        },
        fontFamily: {
          sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto',
                 '"Helvetica Neue"', 'Arial', 'sans-serif'],
        },
        borderRadius: { xl2: '14px' },
      },
    },
  };
</script>
<style>
  :root {
    --tinta: #1A1613; --celeste: #4E9FBF; --celeste-claro: #BFE3EE;
    --crema: #F5EFDD; --papel: #FFFFFF; --borde: #DCD3BB;
    --gris: #6B6259; --terracota: #C97B63; --ambar: #C79A3D; --whatsapp: #25D366;
  }
  html, body { background: var(--crema); }
  * { -webkit-tap-highlight-color: transparent; }
  input:focus, button:focus, a:focus { outline: 2px solid var(--celeste); outline-offset: 2px; }
  .safe-b { padding-bottom: max(env(safe-area-inset-bottom), 0px); }
  .tap { min-height: 48px; min-width: 48px; }

  /* iOS hace zoom automatico al enfocar un input con font-size < 16px.
     Forzamos 16px en todo campo editable, sin importar la clase de Tailwind. */
  input, textarea, select { font-size: 16px !important; }

  /* Botones: negro o blanco (decisión de diseño), con la excepción puntual
     de WhatsApp que usa su verde de marca para mantener el reconocimiento. */
  .btn-primario {
    background: var(--tinta); color: var(--crema);
  }
  .btn-secundario {
    background: var(--papel); color: var(--tinta);
    border: 2px solid rgba(26, 22, 19, 0.7);
  }
  .btn-whatsapp {
    background: var(--whatsapp); color: var(--papel);
  }

  /* Safari agrega su propio cromado redondeado a type=search, que se ve
     como un doble borde encima del nuestro. Lo desactivamos. */
  input[type="search"] { -webkit-appearance: none; appearance: none; }

  /* Los buscadores ya tienen su propio borde negro de 2px: el anillo de
     foco de arriba se sumaba como un segundo borde. Solo el borde. */
  input[type="search"]:focus { outline: none; }

  /* ---- Transiciones entre pantallas ----------------------------------
     Cada pantalla es una navegación real, así que no se puede animar la
     que entra hasta que exista. En vez de eso se anima una cortina opaca:
     tapa la pantalla actual deslizándose, recién ahí se navega, y del otro
     lado se descorre cuando la página nueva TERMINÓ de cargar.

     Se probó antes con la View Transitions API y fallaba justo en la ida:
     el navegador descarta la transición si la página destino tarda en
     pintar, y Tailwind viene por CDN y bloquea el primer pintado. Volver sí
     andaba, porque el panel se restauraba de bfcache y pintaba al toque.
     Con la cortina, cuánto se espera lo decidimos nosotros.

     La cortina nunca transforma el contenido de la página: si lo hiciera,
     las barras position:fixed de abajo (Cargar estante, Publicar) pasarían
     a posicionarse contra el elemento animado y pegarían un salto. */
  #cortina {
    position: fixed; inset: 0; z-index: 90;
    background: var(--crema);
    display: flex; align-items: center; justify-content: center;
    visibility: hidden;
    transform: translateX(100%);
  }
  #cortina.visible { visibility: visible; }

  /* La página que entra arranca tapada desde el primer pintado: sin esto se
     vería un fogonazo del contenido nuevo antes de que la cortina se corra. */
  html[data-entrando] #cortina { visibility: visible; transform: none; }

  @keyframes cortina-desde-der { from { transform: translateX(100%); }  to { transform: none; } }
  @keyframes cortina-desde-izq { from { transform: translateX(-100%); } to { transform: none; } }
  @keyframes cortina-hacia-izq { from { transform: none; } to { transform: translateX(-100%); } }
  @keyframes cortina-hacia-der { from { transform: none; } to { transform: translateX(100%); } }

  /* Tapar es más rápido que destapar: al irte querés que reaccione ya, al
     llegar querés ver aparecer la pantalla. */
  #cortina.tapa-der   { animation: cortina-desde-der 220ms cubic-bezier(.4, 0, .2, 1) both; }
  #cortina.tapa-izq   { animation: cortina-desde-izq 220ms cubic-bezier(.4, 0, .2, 1) both; }
  #cortina.destapa-izq { animation: cortina-hacia-izq 320ms cubic-bezier(.22, .61, .36, 1) both; }
  #cortina.destapa-der { animation: cortina-hacia-der 320ms cubic-bezier(.22, .61, .36, 1) both; }

  /* El spinner solo aparece si la espera se hace notar (ver DEMORA_SPINNER).
     En una navegación rápida no llega a verse, que es lo que se busca. */
  #cortina-spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid var(--borde);
    border-top-color: var(--tinta);
    opacity: 0; transition: opacity 200ms ease-in;
    animation: girar 700ms linear infinite;
  }
  #cortina-spinner.visible { opacity: 1; }
  @keyframes girar { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    #cortina, #cortina-spinner { animation-duration: 1ms !important; transition: none; }
  }
</style>
<script>
  // Marca la dirección ANTES del primer pintado, para que el CSS de arriba ya
  // tenga la cortina tapando cuando el navegador pinta por primera vez.
  (function () {
    var marca = null;
    try { marca = sessionStorage.getItem('librero-nav'); sessionStorage.removeItem('librero-nav'); } catch (e) {}
    if (marca) document.documentElement.dataset.entrando = marca;
  })();
</script>
{% block head %}{% endblock %}
</head>
<body class="font-sans text-tinta bg-crema min-h-screen antialiased">
<!-- Primero en el body a propósito: si estuviera al final, el navegador podría
     llegar a pintar el contenido antes de parsear la cortina y se vería un
     fogonazo de la pantalla nueva. Va por encima de todo por su z-index, no
     por su posición en el documento. -->
<div id="cortina" aria-hidden="true"><div id="cortina-spinner"></div></div>

{% block contenido %}{% endblock %}

<script>
(function () {
  var cortina = document.getElementById('cortina');
  var spinner = document.getElementById('cortina-spinner');

  var sinMovimiento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DURACION_TAPAR = sinMovimiento ? 0 : 220;  // igual que .tapa-* en el CSS
  var DEMORA_SPINNER = 450;   // recién si la espera se hace notar
  var ESPERA_MAXIMA = 3000;   // si algo se cuelga, destapar igual

  function limpiar() {
    cortina.className = '';
    spinner.classList.remove('visible');
    delete document.documentElement.dataset.entrando;
  }

  // ---- Salida: tapar y recién entonces navegar ------------------------
  window.irA = function (url, direccion) {
    var atras = direccion === 'atras';
    try {
      sessionStorage.setItem('librero-nav', atras ? 'atras' : 'adelante');
      // El instante del click viaja a la página siguiente: así el spinner se
      // muestra 450ms después de tocar y no 450ms después de cada carga, que
      // lo haría aparecer, desaparecer al cambiar de página, y volver.
      sessionStorage.setItem('librero-nav-t', String(Date.now()));
    } catch (e) {}

    cortina.className = 'visible ' + (atras ? 'tapa-izq' : 'tapa-der');
    setTimeout(function () { spinner.classList.add('visible'); }, DEMORA_SPINNER);
    setTimeout(function () { window.location.href = url; }, DURACION_TAPAR);
  };

  // ---- Links: 'adelante' es el default, volver se marca data-nav="atras"
  document.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var link = e.target.closest && e.target.closest('a[href]');
    if (!link) return;
    // Fuera: descargas (el QR), pestañas nuevas (el catálogo público),
    // anclas y cualquier cosa que salga del sitio.
    if (link.target || link.hasAttribute('download')) return;
    if (link.origin !== window.location.origin) return;
    if (link.getAttribute('href').charAt(0) === '#') return;

    e.preventDefault();
    window.irA(link.href, link.dataset.nav);
  });

  // ---- Entrada: destapar cuando la página TERMINÓ de cargar -----------
  if (document.documentElement.dataset.entrando) {
    var direccion = document.documentElement.dataset.entrando;
    var yaDestapado = false;

    // Lo que falta para cumplir los 450ms desde el click, no desde esta carga.
    var desde = 0;
    try { desde = parseInt(sessionStorage.getItem('librero-nav-t'), 10) || 0; } catch (e) {}
    try { sessionStorage.removeItem('librero-nav-t'); } catch (e) {}
    var restante = desde ? Math.max(0, DEMORA_SPINNER - (Date.now() - desde)) : DEMORA_SPINNER;
    var timerSpinner = setTimeout(function () { spinner.classList.add('visible'); }, restante);

    var destapar = function () {
      if (yaDestapado) return;
      yaDestapado = true;
      clearTimeout(timerSpinner);
      spinner.classList.remove('visible');
      cortina.className = 'visible ' + (direccion === 'atras' ? 'destapa-der' : 'destapa-izq');
      cortina.addEventListener('animationend', limpiar, { once: true });
      // Si animationend no llega (animación cancelada, pestaña en segundo
      // plano), la cortina quedaría tapando para siempre y la app parecería
      // colgada. Nunca dejar que eso dependa de un solo evento.
      setTimeout(limpiar, 600);
    };

    // 'load' y no 'DOMContentLoaded': Tailwind viene por CDN y genera el CSS
    // al ejecutarse. Destapar antes mostraría la pantalla a medio estilar.
    if (document.readyState === 'complete') requestAnimationFrame(destapar);
    else window.addEventListener('load', function () { requestAnimationFrame(destapar); });
    setTimeout(destapar, ESPERA_MAXIMA);
  }

  // Volver con el gesto del navegador restaura desde bfcache: la página puede
  // reaparecer con la cortina tapando de cuando te fuiste. Se limpia siempre.
  window.addEventListener('pageshow', function (e) { if (e.persisted) limpiar(); });
})();
</script>
</body>
</html>
