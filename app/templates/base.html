<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block titulo %}Librero{% endblock %}</title>
<meta name="theme-color" content="#7A9E78">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%93%9A</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          tinta: 'rgb(var(--tinta) / <alpha-value>)',
          celeste: 'rgb(var(--celeste) / <alpha-value>)',
          'celeste-claro': 'rgb(var(--celeste-claro) / <alpha-value>)',
          crema: 'rgb(var(--crema) / <alpha-value>)',
          fondo: 'rgb(var(--fondo) / <alpha-value>)',
          papel: 'rgb(var(--papel) / <alpha-value>)',
          borde: 'rgb(var(--borde) / <alpha-value>)',
          gris: 'rgb(var(--gris) / <alpha-value>)',
          terracota: 'rgb(var(--terracota) / <alpha-value>)',
          ambar: 'rgb(var(--ambar) / <alpha-value>)',
          whatsapp: '#25D366',
          'texto-papel': 'rgb(var(--texto-papel) / <alpha-value>)',
        },
        fontFamily: {
          sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto',
                 '"Helvetica Neue"', 'Arial', 'sans-serif'],
        },
        borderRadius: { xl2: 'var(--radio-xl2)' },
      },
    },
  };
</script>
<style>
  /* Look and feel definitivo: "Kraft Suave" — libreria de usados, papel
     kraft y tonos tierra, con botones tonales (fondo palido + texto e
     icono del mismo color) y esquinas redondeadas. Colores en formato RGB
     (sin "#") para que Tailwind pueda generar tambien las variantes con
     opacidad (bg-x/50, etc). */
  :root {
    --tinta: 46 33 22; --celeste: 122 158 120; --celeste-claro: 215 224 210;
    --crema: 243 236 220; --fondo: 237 227 208; --papel: 251 247 238; --borde: 216 201 172;
    --gris: 122 111 92; --terracota: 165 75 63; --ambar: 184 134 58;
    --texto-papel: 46 33 22; --font-display: 'Lora', serif;
    --radio-xl2: 12px;
    --borde-secundario: rgba(46, 33, 22, 0.3);

    /* Cargar estante (border-celeste en el HTML): tonal verde. */
    --btn-primario-a-bg: rgb(224 232 220); --btn-primario-a-color: rgb(58 92 56); --btn-primario-a-border: rgb(var(--celeste));
    /* Marcar vendidos (border-ambar en el HTML): tonal dorado. */
    --btn-primario-b-bg: rgb(242 231 203); --btn-primario-b-color: rgb(122 86 28); --btn-primario-b-border: rgb(var(--ambar));
  }

  html, body { background: rgb(var(--fondo)); }
  * { -webkit-tap-highlight-color: transparent; }

  /* Es una app pensada para el celular: en pantallas anchas (compu) no
     dejamos que el contenido se estire de punta a punta, se lo centra con
     un ancho maximo tipo "columna de telefono" y buen margen a los costados.
     Una clase mas especifica (ej. max-w-2xl del admin) sigue ganando. */
  body > div { max-width: 480px; margin-left: auto; margin-right: auto; }
  h1 { font-family: var(--font-display); }
  input:focus, button:focus, a:focus { outline: 2px solid rgb(var(--celeste)); outline-offset: 2px; }
  .safe-b { padding-bottom: max(env(safe-area-inset-bottom), 0px); }
  .tap { min-height: 48px; min-width: 48px; }

  /* iOS hace zoom automatico al enfocar un input con font-size < 16px.
     Forzamos 16px en todo campo editable, sin importar la clase de Tailwind. */
  input, textarea, select { font-size: 16px !important; }

  /* Los campos de formulario sin clase de color explícita heredan el fondo
     nativo del navegador (normalmente blanco). Los fijamos a los tokens de
     superficie por default; una clase Tailwind explícita puede pisar esto. */
  input, select, textarea { background-color: rgb(var(--papel)); color: rgb(var(--texto-papel)); }

  /* Botones primarios: tratamiento tonal verde por defecto (fondo pálido,
     texto e ícono del mismo color, con recuadro) para cualquier
     .btn-primario suelto — Cargar fotos, Guardar, Publicar, etc. */
  .btn-primario {
    background: var(--btn-primario-a-bg); color: var(--btn-primario-a-color);
    border: 2px solid var(--btn-primario-a-border);
  }

  /* "Cargar estante" (border-celeste en el HTML) y "Marcar vendidos"
     (border-ambar) son semánticamente entrada y salida — cada uno con su
     propio tratamiento. El selector compuesto (mismo peso que
     .border-celeste/.border-ambar de Tailwind) evita depender del orden
     de inyección del CDN. */
  .btn-primario.border-celeste {
    background: var(--btn-primario-a-bg); color: var(--btn-primario-a-color); border-color: var(--btn-primario-a-border);
  }
  .btn-primario.border-ambar {
    background: var(--btn-primario-b-bg); color: var(--btn-primario-b-color); border-color: var(--btn-primario-b-border);
  }
  .btn-secundario {
    background: rgb(var(--papel)); color: rgb(var(--texto-papel));
    border: 2px solid var(--borde-secundario);
  }
  .btn-whatsapp {
    background: #25D366; color: #FFFFFF;
  }

  /* Safari agrega su propio cromado redondeado a type=search, que se ve
     como un doble borde encima del nuestro. Lo desactivamos. */
  input[type="search"] { -webkit-appearance: none; appearance: none; }
  input[type="search"]:focus { outline: none; }
</style>
{% block head %}{% endblock %}
</head>
<body class="font-sans text-texto-papel bg-fondo min-h-screen antialiased">
{% block contenido %}{% endblock %}
</body>
</html>
