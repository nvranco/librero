{% extends "base.html" %}
{% block titulo %}Elegir catálogo — {{ libreria.nombre }}{% endblock %}
{% block contenido %}
<div class="min-h-screen flex flex-col">

  <header class="bg-celeste px-5 pt-8 pb-6">
    <a href="{{ volver }}" class="text-tinta text-sm font-medium">← Volver</a>
    <h1 class="text-2xl font-bold text-tinta leading-tight mt-1">Elegir catálogo</h1>
    <p class="text-sm text-tinta/80 mt-1 truncate">Para: {{ libro.titulo }}</p>
  </header>

  <main class="flex-1 px-5 -mt-3 pb-10 space-y-2">
    <button type="button" data-catalogo-id=""
      class="tap w-full text-left bg-papel rounded-xl2 p-3 {{ 'border-2 border-celeste' if libro.catalogo_id is none else 'border border-borde' }}">
      <p class="font-medium">📁 Catálogo general</p>
      <p class="text-xs text-gris mt-1">Sin catálogo puntual</p>
    </button>

    {% for c in catalogos %}
    <button type="button" data-catalogo-id="{{ c.id }}"
      class="tap w-full text-left bg-papel rounded-xl2 p-3 {{ 'border-2 border-celeste' if libro.catalogo_id == c.id else 'border border-borde' }}">
      <p class="font-medium">📁 {{ c.nombre }}</p>
      {% if c.descripcion %}<p class="text-sm text-gris mt-1">{{ c.descripcion }}</p>{% endif %}
      <p class="text-xs text-gris mt-1">{{ c.cant_libros }} libro{{ 's' if c.cant_libros != 1 else '' }}</p>
    </button>
    {% else %}
    <p class="text-center text-gris text-sm mt-6">Todavía no creaste ningún catálogo.</p>
    {% endfor %}
  </main>
</div>

<script>
  const LIBRERO_SLUG = "{{ libreria.slug }}";
  const LIBRERO_TOKEN = "{{ libreria.token_panel }}";
  const LIBRO_ID = {{ libro.id }};
  const API_BASE = `/api/${LIBRERO_SLUG}/${LIBRERO_TOKEN}`;
  const VOLVER = document.querySelector('header a').getAttribute('href');

  document.querySelectorAll('[data-catalogo-id]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      document.querySelectorAll('[data-catalogo-id]').forEach((b) => (b.disabled = true));
      const valor = btn.dataset.catalogoId;
      const catalogoId = valor ? Number(valor) : null;
      try {
        await fetch(`${API_BASE}/libros/${LIBRO_ID}/catalogo`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ catalogo_id: catalogoId }),
        });
      } catch (err) {}
      window.location.href = VOLVER;
    });
  });
</script>
{% endblock %}
